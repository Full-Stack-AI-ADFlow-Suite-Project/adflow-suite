# Controllo del frontend a ogni PR: lint e build come in frontend/README.md (Controlli).
name: Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  controllo-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dipendenze
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test dei componenti
        working-directory: frontend
        run: npm test
