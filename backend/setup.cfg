# Configurazione di mutmut per la simulazione di accettazione (T4-104, ADR-120).
# Si lancia con: da `backend/`, `uvx mutmut run --max-children 1`
# (`--max-children 1` è obbligatorio: le prove condividono adflow_test e il
# parallelismo renderebbe inaffidabili i risultati). I mutanti superstiti si
# leggono con `uvx mutmut results`. Il database dei test non si tocca: la
# fixture di `tests/conftest.py` lo svuota a ogni esecuzione.
[mutmut]
source_paths =
    app/moduli/contenuti/domain.py
    app/moduli/campagne/domain.py
    app/moduli/contenuti/validatore.py
    app/moduli/campagne/foto_pubblica.py
pytest_add_cli_args_test_selection =
    tests/moduli/contenuti/test_validatore.py
    tests/moduli/contenuti/test_piano.py
    tests/moduli/campagne/test_foto_pubblica.py
    tests/moduli/campagne/test_api_bozza.py
pytest_add_cli_args =
    -x
    -q
also_copy =
    app
    .env
    pytest.ini
    alembic.ini
    alembic
    tests
use_git_change_detection = false
